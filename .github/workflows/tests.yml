name: Project integrity
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'audit/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m chorus_hit.readiness
      - run: python -m chorus_hit.hit_nonhit.smoke --out output/hit_nonhit/ci_smoke

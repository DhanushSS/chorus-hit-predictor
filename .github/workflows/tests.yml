name: Project integrity
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'feat/**', cleanup/current-project]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python scripts/setup_model.py
      - run: python -m pytest -q
  extractor-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audio-probe.txt
      - run: python -m pip install -r requirements-audio-probe.txt
      - run: python -m pip check
      - run: python scripts/probe_essentia.py --out linux_probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-extractor-schema-probe
          path: linux_probe.json
